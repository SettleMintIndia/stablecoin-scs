specVersion: 1.2.0
schema:
  file: schema.graphql
dataSources:
  - kind: ethereum/contract
    name: tokenregistry
    network: localhost
    source:
      address: "0x61978b4272a429f14a186e10DEAA51bb8a7Fc6a8"
      abi: TokenRegistry
      startBlock: 11351972
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - TokenRegistry
      abis:
        - name: TokenRegistry
          file: ../out/Registry.sol/Registry.json
        - name: Token
          file: ../out/Token.sol/Token.json
      eventHandlers:
        - event: TokenAdded(address,string,address,string)
          handler: handleTokenAdded
        - event: RoleAdminChanged(indexed bytes32,indexed bytes32,indexed bytes32)
          handler: handleRoleAdminChanged
        - event: RoleGranted(indexed bytes32,indexed address,indexed address)
          handler: handleRoleGranted
        - event: RoleRevoked(indexed bytes32,indexed address,indexed address)
          handler: handleRoleRevoked
      file: ./src/tokenregistry.ts
      # - kind: ethereum/contract
    # name: universal-verifier
    # network: localhost
    # source:
    #   address: "0x70696036CA1868B42155b06235F95549667Eb0BE"
    #   abi: UniversalVerifier
