apiVersion: batch/v1
kind: Job
metadata:
  name: scs-graph-amoy-deploy
  namespace: stablecoin
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: ghcr-secret
      initContainers:
        - name: wait-for-graph
          image: busybox:1.35
          command:
            - sh
            - -c
            - |
              echo "Waiting for graph-node and ipfs..."
              until nc -z ipfs 5001; do
                echo "Waiting for services..."
                sleep 5
              done
              echo "Services are ready!"
      containers:
        - name: graph-amoy
          image: ghcr.io/settlemintindia/stablecoin-scs:latest
          imagePullPolicy: Always
          workingDir: /app
          command:
            - sh
            - -c
            - |
              npm run graph:compile:amoy
              npm run graph:deploy:amoy