apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: stablecoin
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          args:
            - postgres
            - -cshared_preload_libraries=pg_stat_statements
            - -cmax_connections=200
          env:
            - name: POSTGRES_USER
              value: graph-node
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              value: graph-node
            - name: PGDATA
              value: /var/lib/postgresql/data
            - name: POSTGRES_INITDB_ARGS
              value: "-E UTF8 --locale=C"
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc